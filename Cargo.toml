[package]
name = "llm-wiki"
version = "0.1.1"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
blake3 = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
unicode-normalization = "0.1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
scraper = "0.19"
lopdf = "0.32"
pdf-extract = "0.7"
ureq = { version = "3", features = ["multipart"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
serde_json = "1"
