name: Release

# Publishes the CLI itself: one static-ish executable per platform, attached to
# the tagged release. The skills are plain files and travel with the repository,
# so there is nothing to package around them.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# or run this workflow by hand from the Actions page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The artifact *is* the binary, so the shipped profile has to be the one
      # that passes the suite. No packaging step follows that could mask it.
      - name: Test the release profile
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      # Strip the debug-looking tail off unix builds; Windows has no `strip`
      # for PE binaries in the runner image, and its symbols are already small.
      - name: Shrink (unix)
        if: runner.os != 'Windows'
        run: strip -x target/release/llm-wiki

      - name: Name the asset
        id: asset
        shell: bash
        run: |
          set -eu
          triple=$(rustc -vV | sed -n 's/^host: //p')
          name="llm-wiki-${triple}"
          if [ -f target/release/llm-wiki.exe ]; then
            name="${name}.exe"
            cp target/release/llm-wiki.exe "dist-${name}"
          else
            cp target/release/llm-wiki "dist-${name}"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist-*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List the assets
        run: ls -l dist

      # Earlier releases carried a tarball per platform. The CLI is published as
      # a bare binary now, so anything that is not one gets dropped instead of
      # piling up beside it.
      - name: Drop assets from the packaged era
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' |
            while read -r name; do
              case "$name" in
                llm-wiki-*) ;;
                *) echo "deleting $name"; gh release delete-asset "$TAG" "$name" --yes ;;
              esac
            done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/llm-wiki-*
          generate_release_notes: true
          fail_on_unmatched_files: true
