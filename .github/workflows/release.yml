name: Release

# Publish the complete standalone output directory for each native platform.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test the release profile
        run: cargo test --release --locked

      - name: Build
        run: bash scripts/build-output.sh

      # Strip the debug-looking tail off unix builds; Windows has no `strip`
      # for PE binaries in the runner image, and its symbols are already small.
      - name: Shrink (unix)
        if: runner.os != 'Windows'
        run: strip -x output/.wiki/cli/llm-wiki

      - name: Archive (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p dist
          tar -czf "dist/llm-wiki-${triple}.tar.gz" output

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $triple = ((rustc -vV | Select-String '^host: ') -replace '^host: ', '')
          New-Item -ItemType Directory -Force dist | Out-Null
          tar -a -cf "dist/llm-wiki-$triple.zip" output

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List the assets
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/llm-wiki-*
          generate_release_notes: true
          fail_on_unmatched_files: true
