name: Release

# Publishes the skill package with a native binary for each platform, so
# consumers download a ready-to-copy directory instead of building anything.
# Trigger it by pushing a tag (`git tag v0.1.0 && git push --tags`) or by hand
# from the Actions page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      # Same step as CI: the package only works elsewhere if it carries a
      # binary for that platform.
      - name: Vendor the binary into the package
        shell: bash
        run: ./scripts/vendor.sh

      # The archive would be untested otherwise: these are the tests that prove
      # a copied package runs, so run them before shipping it.
      - name: Test the package
        run: cargo test --release --locked

      - name: Package the skill bundle
        shell: bash
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version=dev
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p dist
          name="llm-wiki-skills-${version}-${triple}.tar.gz"
          tar -czf "dist/$name" skills scripts README.md
          echo "packaged dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List the assets
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
