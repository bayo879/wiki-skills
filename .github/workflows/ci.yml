name: CI

on:
  push:
    branches: [main, feat/llm-wiki]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build
        run: cargo build --locked

      # Cargo's failure text only exists in the step log, which needs repo
      # admin rights to download. Re-emitting the interesting lines as
      # workflow commands puts them in the public annotations, so a failing
      # Windows run can be diagnosed without credentials.
      - name: Test
        shell: bash
        run: |
          set +e
          # --no-fail-fast so one run reports every platform-specific failure,
          # instead of stopping at the first test binary that breaks.
          cargo test --locked --no-fail-fast > test-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            sed -n '/^failures:$/,/^test result:/p' test-output.log | head -80 | while IFS= read -r line; do
              echo "::error title=failing test::$line"
            done
            grep -A3 -E "^thread '" test-output.log | head -60 | while IFS= read -r line; do
              echo "::error title=panic::$line"
            done
          fi
          tail -40 test-output.log
          exit $status

      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test-output.log
          if-no-files-found: ignore

      # The optimized profile is verified separately: overflow behaviour,
      # `debug_assertions` and optimizer-sensitive code differ from debug.
      - name: Test (release)
        run: cargo test --release --locked

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
