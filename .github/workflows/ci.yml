name: CI

on:
  push:
    branches: [main, feat/llm-wiki]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build
        run: cargo build --locked

      # The distributable skill package carries a release binary. Vendoring it
      # here keeps `tests/skills_install.rs` honest: that test would otherwise
      # only ever prove the macOS developer's checkout works.
      - name: Vendor the binary into the skill package
        shell: bash
        run: |
          cargo build --release --locked
          ./scripts/vendor.sh

      - name: Test
        run: cargo test --locked

      # The optimized profile is verified separately: overflow behaviour,
      # `debug_assertions` and optimizer-sensitive code differ from debug.
      - name: Test (release)
        run: cargo test --release --locked

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
